name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/DshDesktop/DshDesktop.csproj

      - name: Build (Release)
        run: dotnet build src/DshDesktop/DshDesktop.csproj -c Release --no-restore
